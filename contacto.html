<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explora Otavalo - Contacto</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-container">
            <div class="logo-container">
                <img src="images/logo.png" alt="Logo Otavalo" class="logo-img">
                <span class="logo-text">Explora<strong>Otavalo</strong></span>
            </div>
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Inicio</a></li>
                    <li><a href="destinos.html" class="nav-link">Destinos</a></li>
                    <li><a href="servicios.html" class="nav-link">Servicios</a></li>
                    <li><a href="nosotros.html" class="nav-link">Nosotros</a></li>
                    <li><a href="contacto.html" class="nav-link active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container section-padding">
        <div class="text-center" style="margin-bottom: 40px;">
            <h2>Contáctanos</h2>
            <p>¿Tienes dudas o deseas planificar un viaje a la medida? Escríbenos.</p>
        </div>
        
        <div style="max-width: 600px; margin: 0 auto; background: var(--white); padding: 40px; border-radius: 12px; box-shadow: var(--shadow);">
            <form>
                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom: 8px; font-weight: 500;">Nombre completo</label>
                    <input type="text" placeholder="Tu nombre" style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom: 8px; font-weight: 500;">Correo electrónico</label>
                    <input type="email" placeholder="tucorreo@email.com" style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom: 8px; font-weight: 500;">Mensaje</label>
                    <textarea rows="4" placeholder="¿En qué podemos ayudarte?" style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; border: none;">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Explora Otavalo. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
